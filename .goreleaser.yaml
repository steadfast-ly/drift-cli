version: 2

project_name: drift-cli

before:
  hooks:
    # Module download is a build prerequisite only. The release gate itself
    # lives in .github/workflows/release.yaml: that workflow reuses the green
    # push-to-main ci.yaml run for the exact tagged commit when one exists,
    # and falls back to the full `just check` when it does not (issue #10) --
    # a tag that re-ran the suite the merge already ran green would duplicate
    # the most expensive CI step on every release.
    - go mod download

builds:
  - id: drift
    main: .
    binary: drift
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # The version an operator reports in an incident has to be the tag that
      # was built, never a constant somebody forgot to bump.
      - -s -w
      - -X github.com/steadfast-ly/drift-cli/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: drift
    # `mise use -g github:...` and the curl installer both expect the binary at
    # the archive root under a predictable name.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    mise use -g github:steadfast-ly/drift-cli
    ```

    Then point it at a deployment:

    ```sh
    drift context add <name> --endpoint https://drift.example.com
    drift auth login
    drift doctor
    ```
