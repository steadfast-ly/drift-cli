name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Never cancelled: a duplicated tag-push event would otherwise race two
# goreleaser runs against the same GitHub Release (observed live on v0.12.0).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      # The goreleaser hooks below run `just check-generated` and `just test`.
      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
