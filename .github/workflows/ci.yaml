name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One CI run per ref: a newer push cancels the in-flight run for the same
# branch/PR instead of queueing a duplicate behind it.
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      # The recipes below are just recipes; the justfile is their only home.
      - name: Install just
        uses: extractions/setup-just@v3

      # Pinned exactly. A floating generator would make `check-generated`
      # fail on an unrelated upstream release and turn the contract gate into
      # noise nobody trusts.
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      - name: gofmt
        run: just fmt-check

      - name: go vet
        run: just vet

      # The gate the whole generated-client rule rests on: if the committed
      # client and the vendored spec disagree, the build fails here rather than
      # at runtime against a live server.
      - name: Generated client matches the vendored spec
        run: just check-generated

      - name: Tests
        run: just test

      - name: Tests (race detector)
        run: just test-race

      - name: Build
        run: just build
