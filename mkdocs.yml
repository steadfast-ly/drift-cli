site_name: Drift
site_url: https://steadfast-ly.github.io/drift-cli/
repo_url: https://github.com/steadfast-ly/drift-cli
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - search.highlight

exclude_docs: |
  TODO.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Network access: getting-started/network.md
      - First steps: getting-started/first-steps.md
      - Web UI: getting-started/web-ui.md
  - Concepts:
      - Roles: concepts/roles.md
      - Contexts and authentication: concepts/contexts-auth.md
      - Environments: concepts/environments.md
      - Releases and promotions: concepts/releases.md
  - For developers:
      - Preview environments: guides/preview-envs.md
      - PR statuses: guides/pr-statuses.md
      - End-to-end tests: guides/e2e.md
  - For QA:
      - QA queue: guides/qa.md
  - For release managers:
      - Promotions: guides/promotions.md
  - For admins:
      - Administration: guides/administration.md
  - Activity:
      - Audit log and KPIs: guides/activity.md
  - Automation:
      - CI and automation: guides/automation.md
      - LLM agents: guides/agents.md
      - Updating: guides/updating.md
  - Reference:
      - Configuration: reference/configuration.md
      - Errors and exit codes: reference/errors.md
      - Command reference: reference/commands/index.md
  - Troubleshooting: troubleshooting.md
